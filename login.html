<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INAS — Institute Authentication Services | IIT Gandhinagar</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1f4fd8;
      --blue-dark: #0d1b3e;
      --blue-mid: #1a3a8f;
      --blue-panel: #1a47b8;
      --text-dark: #1b2233;
      --text-muted: #6b7280;
      --border: #dde3ef;
      --input-bg: #f9fafc;
      --error: #dc2626;
      --success: #16a34a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d1b3e;
      position: relative;
      overflow: hidden;
    }

    /* Animated background — network of colored panels mimicking IITGN facade */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(135deg, #0d1b3e 0%, #102060 50%, #0a1530 100%);
    }

    .bg-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 60px,
          rgba(255,255,255,0.03) 60px,
          rgba(255,255,255,0.03) 61px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 60px,
          rgba(255,255,255,0.03) 60px,
          rgba(255,255,255,0.03) 61px
        );
    }

    /* Coloured panel grid — inspired by screenshot's colourful grid façade */
    .bg-panels {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 6px;
      padding: 6px;
      opacity: 0.22;
    }

    .bg-panel {
      border-radius: 4px;
      animation: panelPulse 6s ease-in-out infinite;
    }

    .bg-panel:nth-child(3n) { background: #d4270a; }
    .bg-panel:nth-child(3n+1) { background: #e8b800; }
    .bg-panel:nth-child(3n+2) { background: #1f4fd8; }
    .bg-panel:nth-child(7n) { background: #16a34a; }
    .bg-panel:nth-child(5n) { background: #b91c1c; }
    .bg-panel:nth-child(11n) { background: #0d1b3e; }

    @keyframes panelPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* Rope/wire grid overlay */
    .bg-wires {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          45deg,
          rgba(180,200,255,0.06) 0px,
          rgba(180,200,255,0.06) 1px,
          transparent 1px,
          transparent 88px
        ),
        repeating-linear-gradient(
          -45deg,
          rgba(180,200,255,0.06) 0px,
          rgba(180,200,255,0.06) 1px,
          transparent 1px,
          transparent 88px
        );
    }

    /* Page wrapper */
    .page-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 820px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Login card */
    .login-card {
      display: flex;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.06);
      animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Left blue panel */
    .left-panel {
      width: 240px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #1d4ed8 0%, #0d1b3e 100%);
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      top: -60px;
      left: -60px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }

    .left-panel::after {
      content: '';
      position: absolute;
      bottom: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }

    .left-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .left-logo-circle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }

    .left-logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .left-institute-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
      line-height: 1.4;
    }

    /* IITGN Campus photo area in blue panel */
    .left-campus-img {
      position: relative;
      z-index: 1;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      height: 110px;
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .left-campus-img svg {
      opacity: 0.4;
      width: 60px;
      height: 60px;
    }

    .left-support {
      font-size: 11px;
      color: rgba(255,255,255,0.65);
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    .left-support a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
    }

    .left-support a:hover {
      text-decoration: underline;
    }

    /* Right form panel */
    .right-panel {
      flex: 1;
      background: #ffffff;
      padding: 44px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-title-row {
      margin-bottom: 28px;
    }

    .inas-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .inas-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-divider {
      height: 1px;
      background: var(--border);
      margin: 0 0 24px 0;
    }

    .form-field {
      margin-bottom: 16px;
      position: relative;
    }

    .form-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .form-field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: var(--text-dark);
      background: var(--input-bg);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(31, 79, 216, 0.12);
      background: #fff;
    }

    .form-field input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 12.5px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
    }

    .remember-me input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--blue);
      font-weight: 600;
      text-decoration: none;
      font-size: 12.5px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-signin {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 8px rgba(31, 79, 216, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-signin:hover {
      background: #173fae;
      box-shadow: 0 4px 16px rgba(31, 79, 216, 0.4);
      transform: translateY(-1px);
    }

    .btn-signin:active {
      transform: translateY(0);
    }

    .btn-signin:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-signin .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-signin.loading .spinner {
      display: block;
    }

    .btn-signin.loading .btn-label {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      display: none;
      align-items: center;
      gap: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--error);
      margin-top: 14px;
    }

    .error-message.visible {
      display: flex;
    }

    .error-message svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .form-footer-note {
      margin-top: 22px;
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .form-footer-note a {
      color: var(--blue);
      font-weight: 600;
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .left-panel {
        display: none;
      }
      .right-panel {
        padding: 32px 24px;
      }
    }
  </style>
</head>

<body>
  <!-- Background canvas -->
  <div class="bg-canvas">
    <div class="bg-panels" id="bgPanels"></div>
    <div class="bg-wires"></div>
  </div>

  <!-- Login Card -->
  <div class="page-wrapper">
    <div class="login-card">

      <!-- Left Blue Panel -->
      <div class="left-panel">
        <div class="left-logo-wrap">
          <div class="left-logo-circle">
            <img src="logo.svg" alt="IITGN Logo">
          </div>
          <div class="left-institute-name">IIT Gandhinagar</div>
        </div>

        <!-- Campus illustration -->
        <div class="left-campus-img">
          <svg viewBox="0 0 100 80" fill="none">
            <!-- Simple building silhouette -->
            <rect x="10" y="40" width="80" height="35" fill="rgba(255,255,255,0.15)" rx="2"/>
            <rect x="20" y="30" width="60" height="15" fill="rgba(255,255,255,0.12)" rx="2"/>
            <rect x="30" y="22" width="40" height="12" fill="rgba(255,255,255,0.1)" rx="2"/>
            <rect x="40" y="15" width="20" height="10" fill="rgba(255,255,255,0.08)" rx="2"/>
            <!-- Windows -->
            <rect x="15" y="45" width="10" height="8" fill="rgba(255,255,255,0.25)" rx="1"/>
            <rect x="30" y="45" width="10" height="8" fill="rgba(255,255,255,0.25)" rx="1"/>
            <rect x="45" y="45" width="10" height="8" fill="rgba(255,255,255,0.25)" rx="1"/>
            <rect x="60" y="45" width="10" height="8" fill="rgba(255,255,255,0.25)" rx="1"/>
            <rect x="75" y="45" width="10" height="8" fill="rgba(255,255,255,0.25)" rx="1"/>
            <rect x="35" y="55" width="30" height="20" fill="rgba(255,255,255,0.2)" rx="1"/>
          </svg>
        </div>

        <div class="left-support">
          For support, please contact:<br>
          <a href="mailto:helpdesk.iit@iitgn.ac.in">helpdesk.iit@iitgn.ac.in</a>
        </div>
      </div>

      <!-- Right Form Panel -->
      <div class="right-panel">
        <div class="form-title-row">
          <div class="inas-title">इनास / INAS</div>
          <div class="inas-subtitle">Institute Authentication Services</div>
        </div>

        <div class="form-divider"></div>

        <form id="loginForm" autocomplete="off" novalidate>
          <div class="form-field">
            <label for="usernameInput">Username</label>
            <input
              type="text"
              id="usernameInput"
              name="username"
              placeholder="Enter your IITGN username"
              autocomplete="username"
              spellcheck="false"
              required
            >
          </div>

          <div class="form-field">
            <label for="passwordInput">Password</label>
            <input
              type="password"
              id="passwordInput"
              name="password"
              placeholder="••••••••••••••"
              autocomplete="current-password"
              required
            >
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe"> Remember me
            </label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-signin" id="signinBtn">
            <div class="spinner"></div>
            <span class="btn-label">Sign In</span>
          </button>

          <div class="error-message" id="errorMsg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="errorText">Invalid username or password.</span>
          </div>
        </form>

        <div class="form-footer-note">
          This system is for authorized IITGN personnel and students only.<br>
          <a href="index.html">← Return to Health Centre Home</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ---- Background panels ---- */
    const panelColors = [
      '#d4270a','#e8b800','#1f4fd8','#16a34a','#b91c1c','#0d1b3e',
      '#c0392b','#f59e0b','#2563eb','#0f766e','#7c3aed','#1e3a8a'
    ];
    const grid = document.getElementById('bgPanels');
    for (let i = 0; i < 96; i++) {
      const div = document.createElement('div');
      div.className = 'bg-panel';
      div.style.background = panelColors[i % panelColors.length];
      div.style.animationDelay = `${(i * 0.07) % 6}s`;
      div.style.animationDuration = `${4 + (i % 5)}s`;
      grid.appendChild(div);
    }

    /* ---- Auth logic ---- */
    const VALID_USERNAME = 'admin';
    const VALID_PASSWORD = 'admin';
    const SESSION_KEY = 'hcrs_session';

    // If already logged in, skip to booking
    if (sessionStorage.getItem(SESSION_KEY) === 'authenticated') {
      window.location.replace('booking.html');
    }

    const form = document.getElementById('loginForm');
    const signinBtn = document.getElementById('signinBtn');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');

    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.classList.add('visible');
      usernameInput.classList.add('error');
      passwordInput.classList.add('error');
    }

    function clearError() {
      errorMsg.classList.remove('visible');
      usernameInput.classList.remove('error');
      passwordInput.classList.remove('error');
    }

    usernameInput.addEventListener('input', clearError);
    passwordInput.addEventListener('input', clearError);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      clearError();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('Please enter both username and password.');
        return;
      }

      // Show loading state
      signinBtn.classList.add('loading');
      signinBtn.disabled = true;

      // Simulate a brief network delay
      setTimeout(() => {
        if (username === VALID_USERNAME && password === VALID_PASSWORD) {
          sessionStorage.setItem(SESSION_KEY, 'authenticated');
          window.location.replace('booking.html');
        } else {
          signinBtn.classList.remove('loading');
          signinBtn.disabled = false;
          showError('Invalid username or password. Please try again.');
          passwordInput.value = '';
          passwordInput.focus();
        }
      }, 700);
    });
  </script>
</body>
</html>
